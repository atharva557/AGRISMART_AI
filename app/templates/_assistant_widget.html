<!--
  _assistant_widget.html
  Include this partial in any page that needs the Farmer Assistant widget.
  The page must expose a window.detectionContext object before this script
  loads. Example (set by the including page's own <script> block):

      window.detectionContext = {
        disease_label: "Tomato___Early_blight",   ← raw model class label
        confidence: 0.91,
        crop: "Tomato",
        stage: "...",
        irrigation: {...} | null,
        weather: {...} | null,
        sustainability: {...} | null,
        crop_recommendation: {...} | null
      };

  NOTE: disease_label MUST be the raw_label from the backend response
  (e.g. "Tomato___Early_blight"), NOT the human-readable disease name.
  The backend knowledge-base lookup depends on the exact class string.
-->
<section id="assistant-widget" class="assistant-widget">
  <div class="assistant-header">
    <h3>🌾 Farmer Assistant</h3>
    <select id="assistant-lang">
      <option value="en">English</option>
      <option value="hi">हिन्दी (Hindi)</option>
      <option value="gu">ગુજરાતી (Gujarati)</option>
      <option value="mr">मराठी (Marathi)</option>
      <option value="ta">தமிழ் (Tamil)</option>
      <option value="te">తెలుగు (Telugu)</option>
      <option value="kn">ಕನ್ನಡ (Kannada)</option>
      <option value="bn">বাংলা (Bengali)</option>
      <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
    </select>
  </div>

  <div id="assistant-explanation" class="assistant-explanation">Loading explanation…</div>

  <div id="assistant-chat-log" class="assistant-chat-log"></div>

  <form id="assistant-chat-form" class="assistant-chat-form">
    <input id="assistant-input" type="text" placeholder="Ask a question, e.g. 'Should I water today?'" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</section>

<script src="{{ url_for('static', filename='js/assistant.js') }}"></script>
