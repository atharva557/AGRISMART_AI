<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prediction result · AgriSmart AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/assistant.css') }}">
</head>
<body>
  <main>
    <h1>Prediction result</h1>
    <p>This is a template for the future prediction flow. No image has been analyzed.</p>
    <p>The core teammate will connect the disease label, validated confidence information, and precautionary guidance here.</p>
    <a href="{{ url_for('main.index') }}">Back to home</a>

    <!-- Farmer Assistant widget (Bonus E) --------------------------------->
    <!-- When the core prediction route is ready, replace the hardcoded
         detectionContext below with Jinja template variables from your
         prediction response, e.g.:
           disease_label: "{{ predicted_class }}",
           confidence: {{ confidence }},
    -->
    <script>
      window.detectionContext = {
        disease_label: "{{ predicted_class | default('', true) }}",
        confidence: {{ confidence | default('null', true) }},
        crop: "{{ crop | default('', true) }}",
        stage: "{{ stage | default('', true) }}",
        irrigation: {{ irrigation_json | default('null', true) | safe }},
        weather: {{ weather_json | default('null', true) | safe }},
        sustainability: {{ sustainability_json | default('null', true) | safe }},
        crop_recommendation: {{ crop_rec_json | default('null', true) | safe }}
      };
    </script>
    {% include "_assistant_widget.html" %}
  </main>
</body>
</html>
