<header class="site-header" id="site-header">
  <nav class="container mx-auto px-4 sm:px-6 lg:px-8" role="navigation" aria-label="Main navigation">
    <div class="flex items-center justify-between h-16 gap-4">

      <!-- ── Brand (top-left) ──────────────────────────────── -->
      <div class="flex items-center flex-shrink-0">
        <a href="/"
           class="brand-link nav-brand-slide focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2"
           style="outline-color: var(--primary);"
           aria-label="AgriSmart AI — Home">
          <svg class="w-8 h-8 flex-shrink-0" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="#176a46" opacity="0.12"/>
            <path d="M20 8C16 8 13 11 13 15C13 17 14 18.5 15 19.5C14 21 12 23 12 26C12 29 14.5 32 20 32C25.5 32 28 29 28 26C28 23 26 21 25 19.5C26 18.5 27 17 27 15C27 11 24 8 20 8Z" fill="#176a46"/>
            <circle cx="20" cy="14" r="2" fill="#dcefa8"/>
          </svg>
          <div class="flex flex-col leading-none gap-0.5">
            <span class="brand-name">AgriSmart AI</span>
            <span class="brand-sub">Smart Agriculture</span>
          </div>
        </a>
      </div>

      <!-- ── Desktop Navigation (centre) ─────────────────────── -->
      <div class="hidden md:flex items-center gap-0.5 flex-1 justify-center">
        <a href="/"       data-nav-link class="nav-link">Home</a>
        <a href="/disease" data-nav-link class="nav-link">Disease Detection</a>
        <a href="/advisory" data-nav-link class="nav-link">Advisory</a>
        <a href="/about"   data-nav-link class="nav-link">About</a>
      </div>

      <!-- ── Right controls: theme toggle + mobile menu ──────── -->
      <div class="flex items-center gap-2 flex-shrink-0">

        <!-- Theme Toggle — pill with day/night slots -->
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Switch to dark mode"
          title="Toggle day / night mode">
          <span id="theme-opt-light" class="theme-toggle__option active" aria-hidden="true">☀️</span>
          <span id="theme-opt-dark"  class="theme-toggle__option"        aria-hidden="true">🌙</span>
        </button>

        <!-- Mobile Menu Button -->
        <button
          id="mobile-menu-button"
          class="md:hidden p-2 rounded-lg transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1"
          style="color: var(--text-secondary); outline-color: var(--primary);"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-haspopup="true">
          <svg id="menu-icon-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg id="menu-icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Mobile Navigation Menu ───────────────────────────── -->
    <div
      id="mobile-menu"
      class="hidden md:hidden pb-4 mt-1"
      style="border-top: 1px solid var(--border);"
      role="menu"
      aria-labelledby="mobile-menu-button">
      <div class="flex flex-col gap-0.5 pt-2">
        <a href="/"        data-nav-link class="nav-link" role="menuitem">Home</a>
        <a href="/disease"  data-nav-link class="nav-link" role="menuitem">Disease Detection</a>
        <a href="/advisory" data-nav-link class="nav-link" role="menuitem">Advisory Dashboard</a>
        <a href="/about"    data-nav-link class="nav-link" role="menuitem">About</a>
      </div>
    </div>
  </nav>
</header>

<script>
  /* ── Theme toggle — runs immediately to avoid flash ──────── */
  (function () {
    'use strict';

    var STORAGE_KEY = 'agrismart-theme';
    var html = document.documentElement;

    /* Apply persisted or system-preferred theme before first paint */
    function applyTheme(theme) {
      if (theme === 'dark') {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
    }

    /* Read persisted preference; fall back to system preference */
    function getInitialTheme() {
      try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored === 'dark' || stored === 'light') return stored;
      } catch (e) {}
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    /* Update pill toggle — move .active class to the current mode slot */
    function syncToggleUI(isDark) {
      var btn      = document.getElementById('theme-toggle');
      var optLight = document.getElementById('theme-opt-light');
      var optDark  = document.getElementById('theme-opt-dark');
      if (!btn) return;

      if (isDark) {
        optLight && optLight.classList.remove('active');
        optDark  && optDark.classList.add('active');
        btn.setAttribute('aria-label', 'Switch to day mode');
      } else {
        optDark  && optDark.classList.remove('active');
        optLight && optLight.classList.add('active');
        btn.setAttribute('aria-label', 'Switch to night mode');
      }
    }

    /* Apply initial theme immediately */
    var initialTheme = getInitialTheme();
    applyTheme(initialTheme);

    document.addEventListener('DOMContentLoaded', function () {
      /* Sync toggle UI after DOM is ready */
      syncToggleUI(html.classList.contains('dark'));

      /* Enable smooth transitions only after initial paint */
      requestAnimationFrame(function () {
        html.classList.add('theme-loaded');
      });

      /* ── Mobile menu ──────────────────────────────────────── */
      var menuButton = document.getElementById('mobile-menu-button');
      var mobileMenu = document.getElementById('mobile-menu');
      var iconOpen   = document.getElementById('menu-icon-open');
      var iconClose  = document.getElementById('menu-icon-close');

      if (menuButton && mobileMenu) {
        menuButton.addEventListener('click', function () {
          var expanded = menuButton.getAttribute('aria-expanded') === 'true';
          menuButton.setAttribute('aria-expanded', String(!expanded));
          mobileMenu.classList.toggle('hidden');
          iconOpen  && iconOpen.classList.toggle('hidden');
          iconClose && iconClose.classList.toggle('hidden');
        });

        mobileMenu.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            mobileMenu.classList.add('hidden');
            menuButton.setAttribute('aria-expanded', 'false');
            iconOpen  && iconOpen.classList.remove('hidden');
            iconClose && iconClose.classList.add('hidden');
          });
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
            mobileMenu.classList.add('hidden');
            menuButton.setAttribute('aria-expanded', 'false');
            iconOpen  && iconOpen.classList.remove('hidden');
            iconClose && iconClose.classList.add('hidden');
            menuButton.focus();
          }
        });
      }

      /* ── Theme toggle click ───────────────────────────────── */
      var toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          var isDark = html.classList.toggle('dark');
          try {
            localStorage.setItem(STORAGE_KEY, isDark ? 'dark' : 'light');
          } catch (e) {}
          syncToggleUI(isDark);
        });
      }
    });
  }());
</script>
